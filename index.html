<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prava — Koreya nazariy imtihon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --asphalt:#0E1420; --surface:#19212F; --surface-2:#222C3D; --line:#2C3850;
    --ink:#F3F6FB; --muted:#93A0B5; --yellow:#FFD60A; --blue:#3B82F6;
    --green:#22C55E; --red:#EF4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--asphalt);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.45;overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
  .muted{color:var(--muted)}
  button{font-family:inherit;cursor:pointer;border:none}
  .num{font-variant-numeric:tabular-nums}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .top .back{background:var(--surface);color:var(--ink);width:40px;height:40px;
    border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center}
  .top h2{font-size:18px}

  /* ---- Metod kartasi (bosh ekran) ---- */
  .method{background:linear-gradient(160deg,var(--surface-2),var(--surface));
    border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
  .method h3{font-size:17px;margin-bottom:8px}
  .method p{font-size:14px;color:#C7D0DD;margin:0 0 10px}
  .method .sign{font-size:13px;color:var(--muted);text-align:right;font-style:italic;margin-top:10px}
  .method-toggle{font-size:12px;color:var(--yellow);font-weight:700;margin-top:8px;display:inline-block}
  .method-body{display:none}
  .method-body.open{display:block}
  .breakdown{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:10px 0;color:var(--muted)}
  .breakdown b{color:var(--ink)}

  /* ---- Kategoriya ro'yxati ---- */
  .catlist{display:grid;gap:12px}
  .cat{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:16px;text-align:left;width:100%;color:var(--ink)}
  .cat .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:22px;flex-shrink:0;background:var(--surface-2)}
  .cat .body{flex:1;min-width:0}
  .cat .t-ko{font-weight:800;font-size:16px}
  .cat .t-uz{font-size:12.5px;color:var(--muted);margin-top:1px}
  .cat .prog{display:flex;align-items:center;gap:8px;margin-top:6px}
  .cat .bar{flex:1;height:5px;background:#0c1119;border-radius:3px;overflow:hidden}
  .cat .bar>i{display:block;height:100%;background:var(--yellow)}
  .cat .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
  .cat .pt{font-size:11px;font-weight:800;color:var(--asphalt);background:var(--yellow);
    border-radius:8px;padding:2px 7px;margin-left:6px;flex-shrink:0}
  .cat:active{background:var(--surface-2)}

  /* ---- Lug'at ---- */
  .search{width:100%;padding:14px 16px;border-radius:14px;background:var(--surface);
    border:1px solid var(--line);color:var(--ink);font-size:15px;margin-bottom:14px}
  .search::placeholder{color:var(--muted)}
  .lugcount{font-size:12px;color:var(--muted);margin-bottom:12px}
  .lugrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:13px 15px;margin-bottom:8px}
  .lugrow .ko{font-weight:800;font-size:17px;flex-shrink:0;min-width:78px}
  .lugrow .body{flex:1;min-width:0}
  .lugrow .uz{font-size:14px;color:var(--ink)}
  .lugrow .note{font-size:11.5px;color:var(--muted);margin-top:1px}
  .lugrow .freq{flex-shrink:0;background:var(--surface-2);color:var(--yellow);font-weight:800;
    font-size:12px;border-radius:10px;padding:4px 9px;text-align:center;white-space:nowrap}
  .lugrow .freq small{display:block;font-size:8.5px;color:var(--muted);font-weight:600}

  /* ---- Savol ekrani ---- */
  .qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
  .pill{background:var(--surface);padding:4px 10px;border-radius:20px;font-weight:700}
  .pill.p5{color:var(--yellow)} .pill.p3{color:var(--blue)} .pill.p2{color:var(--green)}
  .progress{height:6px;background:var(--surface);border-radius:4px;overflow:hidden;margin-bottom:16px}
  .progress > i{display:block;height:100%;background:var(--yellow);transition:.25s}
  .media{background:#0c1119;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center}
  .media svg{width:130px;height:130px}
  .media img{max-width:100%;border-radius:8px}
  .media .note{font-size:13px;color:var(--muted);font-style:italic}
  .qtext{font-size:18px;font-weight:700;margin-bottom:8px}
  .qtext-uz{font-size:15px;color:#8b93a3;margin:-6px 0 14px;line-height:1.45}
  .hint{font-size:12px;color:var(--yellow);margin-bottom:14px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);
    border-radius:14px;padding:14px;font-size:15px;color:var(--ink);text-align:left;width:100%}
  .opt .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
  .opt-uz{display:block;font-size:12.5px;color:#8b93a3;margin-top:3px;line-height:1.35}
  .opt.sel{border-color:var(--yellow)}
  .opt.sel .box{background:var(--yellow);border-color:var(--yellow);color:#11161F}
  .opt.correct{border-color:var(--green)} .opt.correct .box{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red)} .opt.wrong .box{background:var(--red);border-color:var(--red);color:#fff}
  .explain{margin-top:14px;background:var(--surface-2);border-left:3px solid var(--yellow);
    border-radius:10px;padding:14px;font-size:14px}
  .explain b{color:var(--yellow)}

  .cta{position:sticky;bottom:0;padding-top:12px;background:linear-gradient(transparent,var(--asphalt) 40%)}
  .btn{width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:16px}
  .btn.primary{background:var(--yellow);color:#11161F}
  .btn.ghost{background:var(--surface);color:var(--ink)}
  .btn:disabled{opacity:.4}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="muted" style="text-align:center;padding:40px">Yuklanmoqda…</div></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); }

const Store = (() => {
  const mem = {};
  const cloud = tg && tg.CloudStorage && tg.CloudStorage.getItem ? tg.CloudStorage : null;
  return {
    get:(k)=>new Promise(r=>{ cloud ? cloud.getItem(k,(e,v)=>r(e?null:(v||null))) : r(k in mem?mem[k]:null); }),
    set:(k,v)=>new Promise(r=>{ cloud ? cloud.setItem(k,v,()=>r(1)) : (mem[k]=v,r(1)); })
  };
})();
const haptic = (type)=>{ try{ tg?.HapticFeedback?.notificationOccurred(type); }catch(e){} };

const STATE = { questions: [], categories:{}, mastered: new Set(), session: null, methodOpen: false };

async function boot(){
  try{
    const res = await fetch("questions.json?v="+Date.now());
    const data = await res.json();
    STATE.questions = data.questions || [];
    STATE.categories = (data.meta && data.meta.categories) || {};
    STATE.lugatList = data.lugat || [];
  }catch(e){
    document.getElementById("app").innerHTML =
      "<div style='padding:40px;text-align:center'>questions.json yuklanmadi.<br><span class='muted'>"+e+"</span></div>";
    return;
  }
  const m = await Store.get("mastered"); if(m) STATE.mastered = new Set(JSON.parse(m));
  renderHome();
}

/* ============================================================
   BOSH EKRAN — Metod + toifalar ro'yxati
   ============================================================ */
function toggleMethod(){
  STATE.methodOpen = !STATE.methodOpen;
  document.getElementById("methodBody").classList.toggle("open", STATE.methodOpen);
  document.getElementById("methodToggle").textContent = STATE.methodOpen ? "▲ Yopish" : "▼ Metodni o'qish";
}

function renderHome(){
  const cats = Object.entries(STATE.categories).sort((a,b)=>a[1].order-b[1].order);
  const rows = cats.map(([key, meta])=>{
    const pool = STATE.questions.filter(q=>q.category===key);
    const done = pool.filter(q=>STATE.mastered.has(q.id)).length;
    const pct = pool.length ? Math.round(done/pool.length*100) : 0;
    return `
    <button class="cat" onclick="openCategory('${key}')">
      <span class="ic">${meta.icon}</span>
      <span class="body">
        <span class="t-ko">${meta.name_ko}</span><span class="pt">${meta.points} ball</span>
        <span class="t-uz">${meta.name_uz}</span>
        <span class="prog"><span class="bar"><i style="width:${pct}%"></i></span>
          <span class="cnt num">${done}/${pool.length}</span></span>
      </span>
    </button>`;
  }).join("");

  app(`
    <div class="top"><h2>🚗 Prava — nazariy imtihon</h2></div>

    <div class="method">
      <h3>Assalomu alaykum, Koreyada haydovchilik guvohnoma olmoqchi bo'lgan do'stim! 👋</h3>
      <p>Men sizga — oz muddatda o'zim tayyorlanib, nazariy imtihondan oson o'tgan <b>metodim va lug'atimni</b> shu mini-ilova ko'rinishida qoldirdim. Maqsad — vaqtingiz va energiyangizni tejab, tez va oson imtihondan o'tishingiz!</p>
      <span id="methodToggle" class="method-toggle" onclick="toggleMethod()">▼ Metodni o'qish</span>
      <div id="methodBody" class="method-body">
        <p style="margin-top:12px"><b>📋 Metod:</b> Nazariy imtihonda 40 ta savol chiqadi:</p>
        <div class="breakdown">
          <span>📝📷🎨 <b>17 ta</b> — 문장형/사진형/일러스트형 (har biri <b>3 ball</b>)</span>
          <span>🚸 <b>22 ta</b> — 안전표지형 va matnli (har biri <b>2 ball</b>)</span>
          <span>🎬 <b>1 ta</b> — 동영상형 (<b>5 ball</b>)</span>
        </div>
        <p><b>Nega bu ilova kerak?</b> 운전면허PLUS dasturidagi 1000+ savolning HAMMASINI yechib, lug'at chiqarib, vaqt va energiyangizni sarflamang! Shu yerda <b>3 ballik 282 ta, 2 ballik (안전표지형) 99 ta va 5 ballik 35 ta — jami 416 ta</b> eng muhim savolni yeching.</p>
        <p>운전면허PLUS ilovasini telefoningizga o'rnatib, shu bilan birga mashq qiling — 1 hafta, uzog'i bilan 2 haftada imtihonga to'liq tayyor bo'lasiz. 💪</p>
        <p>Sizga manzur bo'lsa — do'stlaringizga ham tarqating. Omad! 🍀</p>
        <div class="sign">— Koryo Bozor jamoasi</div>
      </div>
    </div>

    <div class="catlist">
      ${rows}
      <button class="cat" onclick="openLugat()">
        <span class="ic">📖</span>
        <span class="body">
          <span class="t-ko">Lug'at</span>
          <span class="t-uz">Imtihon savollarida uchraydigan ${(STATE.lugatList||[]).length} ta muhim so'z, chastotasi bilan</span>
        </span>
      </button>
    </div>
  `);
}

/* ============================================================
   LUG'AT
   ============================================================ */
function openLugat(){
  STATE.session = { mode:"lugat" };
  renderLugat("");
}

function renderLugat(query){
  const list = STATE.lugatList || [];
  const q = (query||"").trim().toLowerCase();
  const filtered = q
    ? list.filter(e => e.ko.includes(q) || e.uz.toLowerCase().includes(q) || (e.note||"").toLowerCase().includes(q))
    : list;

  app(`
    <div class="top"><button class="back" onclick="exitSession()">‹</button><h2>📖 Lug'at</h2></div>
    <input class="search" id="lugSearch" placeholder="Koreyscha yoki o'zbekcha qidiring…" value="${query?query.replace(/"/g,'&quot;'):''}" oninput="renderLugat(this.value)">
    <div class="lugcount">${filtered.length} / ${list.length} ta so'z · chastota bo'yicha saralangan</div>
    <div>
      ${filtered.map(e=>`
        <div class="lugrow">
          <span class="ko">${e.ko}</span>
          <span class="body">
            <span class="uz">${e.uz}</span>
            ${e.note?`<div class="note">${e.note}</div>`:''}
          </span>
          <span class="freq">${e.count}×<small>uchraydi</small></span>
        </div>`).join("")}
    </div>
  `);
  const inp = document.getElementById("lugSearch");
  if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
}

/* ============================================================
   TOIFA BO'YICHA O'QISH
   ============================================================ */
function openCategory(cat){
  const list = STATE.questions.filter(q=>q.category===cat);
  if(!list.length){ tg?.showAlert?.("Bu toifada savol yo'q"); return; }
  STATE.session = { mode:"study", cat, list, i:0 };
  renderQuestion();
}

function renderQuestion(){
  const s = STATE.session, q = s.list[s.i];
  s.picked = []; s.checked = false;
  const total = s.list.length;
  const pp = q.points;
  const catMeta = STATE.categories[q.category] || {};
  const media = q.svg
    ? `<div class="media">${q.svg}</div>`
    : (q.media || q.media_note)
      ? `<div class="media">${q.media?`<img src="${q.media}" onerror="this.style.display='none'">`:''}
         ${q.media_note?`<div class="note">${q.media_note}</div>`:''}</div>`
      : "";

  app(`
    <div class="top"><button class="back" onclick="exitSession()">‹</button>
      <h2>${catMeta.icon||''} ${catMeta.name_ko||''}</h2></div>
    <div class="qmeta">
      <span class="num">${s.i+1} / ${total}</span>
      <span class="pill p${pp}">${pp} ball</span>
    </div>
    <div class="progress"><i style="width:${(s.i)/total*100}%"></i></div>
    ${media}
    ${q.question_ko?`<div class="qtext">${q.question_ko}</div><div class="qtext-uz">${q.question_uz}</div>`:`<div class="qtext">${q.question_uz}</div>`}
    ${q.select_count===2?`<div class="hint">Ikkita javob tanlang — ikkalasi to'g'ri bo'lsagina ball</div>`:''}
    <div class="opts" id="opts">
      ${q.options.map((o,idx)=>`
        <button class="opt" data-i="${idx}" onclick="pick(${idx})">
          <span class="box"></span><span>${o.text_ko?`${o.text_ko}<small class="opt-uz">${o.text_uz}</small>`:o.text_uz}</span>
        </button>`).join("")}
    </div>
    <div id="explainSlot"></div>
    <div class="cta">
      <button class="btn primary" id="actBtn" onclick="checkOrNext()" disabled>Tekshirish</button>
    </div>
  `);
}

function pick(idx){
  const s = STATE.session, q = s.list[s.i];
  if(s.checked) return;
  const max = q.select_count;
  const pos = s.picked.indexOf(idx);
  if(pos>-1) s.picked.splice(pos,1);
  else { if(s.picked.length>=max) s.picked.shift(); s.picked.push(idx); }
  document.querySelectorAll(".opt").forEach(el=>{
    el.classList.toggle("sel", s.picked.includes(+el.dataset.i));
    const box = el.querySelector(".box");
    box.textContent = s.picked.includes(+el.dataset.i) ? (max===2?"✓":"●") : "";
  });
  document.getElementById("actBtn").disabled = s.picked.length !== max;
}

function checkOrNext(){
  const s = STATE.session;
  if(!s.checked){ checkAnswer(); } else { nextQuestion(); }
}

function checkAnswer(){
  const s = STATE.session, q = s.list[s.i];
  s.checked = true;
  const correctIdx = q.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);
  const ok = correctIdx.length===s.picked.length && correctIdx.every(i=>s.picked.includes(i));

  document.querySelectorAll(".opt").forEach(el=>{
    const i = +el.dataset.i;
    el.classList.remove("sel");
    if(q.options[i].correct){ el.classList.add("correct"); el.querySelector(".box").textContent="✓"; }
    else if(s.picked.includes(i)){ el.classList.add("wrong"); el.querySelector(".box").textContent="✕"; }
  });

  document.getElementById("explainSlot").innerHTML =
    `<div class="explain"><b>${ok?'To\'g\'ri ✓':'Xato ✕'}</b> — ${q.explanation_uz||''}</div>`;

  if(ok){ STATE.mastered.add(q.id); haptic('success'); } else { haptic('error'); }
  Store.set("mastered", JSON.stringify([...STATE.mastered]));

  const last = s.i >= s.list.length-1;
  const btn = document.getElementById("actBtn");
  btn.textContent = last ? "Yakunlash" : "Keyingi";
}

function nextQuestion(){
  const s = STATE.session;
  if(s.i >= s.list.length-1){ exitSession(); } else { s.i++; renderQuestion(); }
}

function exitSession(){ STATE.session=null; renderHome(); }

function app(html){ document.getElementById("app").innerHTML = html; window.scrollTo(0,0); }

boot();
</script>
</body>
</html>
