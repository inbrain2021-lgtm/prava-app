<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prava — Koreya nazariy imtihon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ---- Palette: Koreya yo'l belgilaridan olingan ---- */
  :root{
    --asphalt:#0E1420;     /* tungi yo'l foni */
    --surface:#19212F;     /* kartalar */
    --surface-2:#222C3D;
    --line:#2C3850;
    --ink:#F3F6FB;         /* matn */
    --muted:#93A0B5;       /* ikkilamchi matn */
    --yellow:#FFD60A;      /* ogohlantirish belgisi (asosiy urg'u) */
    --blue:#3B82F6;        /* ko'rsatma belgisi */
    --green:#22C55E;       /* 합격 / to'g'ri */
    --red:#EF4444;         /* taqiq / xato */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--asphalt);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.45;overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
  .muted{color:var(--muted)}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer;border:none}
  .num{font-variant-numeric:tabular-nums}

  /* ---- Header ---- */
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .top .back{background:var(--surface);color:var(--ink);width:40px;height:40px;
    border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center}
  .top h2{font-size:18px}

  /* ---- Toifa tanlash ---- */
  .seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
  .seg button{flex:1;padding:12px 8px;border-radius:10px;background:transparent;color:var(--muted);
    font-weight:700;font-size:15px;transition:.15s}
  .seg button.on{background:var(--yellow);color:#11161F}
  .seg .sub{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}

  /* ---- SIGNATURE: ball o'lchagich ---- */
  .meter-card{background:linear-gradient(160deg,var(--surface-2),var(--surface));
    border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px}
  .meter-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
  .meter-score{font-size:44px;font-weight:800;line-height:1}
  .meter-score small{font-size:18px;color:var(--muted);font-weight:700}
  .meter-goal{text-align:right;font-size:13px}
  .meter-goal b{color:var(--yellow)}
  .bar{position:relative;height:16px;border-radius:9px;background:#0c1119;overflow:hidden;display:flex}
  .bar span{height:100%}
  .bar .s5{background:var(--yellow)}
  .bar .s3{background:var(--blue)}
  .bar .s2{background:var(--green)}
  .passline{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px;z-index:2}
  .passline::after{content:attr(data-l);position:absolute;top:-17px;left:50%;transform:translateX(-50%);
    font-size:10px;color:var(--ink);white-space:nowrap}
  .legend{display:flex;gap:14px;margin-top:14px;font-size:12px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .verdict{margin-top:12px;font-weight:700;font-size:14px}
  .verdict.pass{color:var(--green)}
  .verdict.fail{color:var(--yellow)}

  /* ---- Menyu tugmalari ---- */
  .menu{display:grid;gap:12px}
  .tile{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:16px;text-align:left;width:100%;color:var(--ink)}
  .tile .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:22px;flex-shrink:0}
  .tile .t{font-weight:700;font-size:16px}
  .tile .d{font-size:13px;color:var(--muted)}
  .tile .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tile:active{background:var(--surface-2)}

  /* ---- Savol ekrani ---- */
  .qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
  .pill{background:var(--surface);padding:4px 10px;border-radius:20px;font-weight:700}
  .pill.p5{color:var(--yellow)} .pill.p3{color:var(--blue)} .pill.p2{color:var(--green)}
  .progress{height:6px;background:var(--surface);border-radius:4px;overflow:hidden;margin-bottom:16px}
  .progress > i{display:block;height:100%;background:var(--yellow);transition:.25s}
  .media{background:#0c1119;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center}
  .media svg{width:120px;height:120px}
  .media img{max-width:100%;border-radius:8px}
  .media .note{font-size:13px;color:var(--muted);font-style:italic}
  .qtext{font-size:18px;font-weight:700;margin-bottom:8px}
  .hint{font-size:12px;color:var(--yellow);margin-bottom:14px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);
    border-radius:14px;padding:14px;font-size:15px;color:var(--ink);text-align:left;width:100%}
  .opt .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
  .opt.sel{border-color:var(--yellow)}
  .opt.sel .box{background:var(--yellow);border-color:var(--yellow);color:#11161F}
  .opt.correct{border-color:var(--green)} .opt.correct .box{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red)} .opt.wrong .box{background:var(--red);border-color:var(--red);color:#fff}
  .explain{margin-top:14px;background:var(--surface-2);border-left:3px solid var(--yellow);
    border-radius:10px;padding:14px;font-size:14px}
  .explain b{color:var(--yellow)}

  .cta{position:sticky;bottom:0;padding-top:12px;background:linear-gradient(transparent,var(--asphalt) 40%)}
  .btn{width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:16px}
  .btn.primary{background:var(--yellow);color:#11161F}
  .btn.ghost{background:var(--surface);color:var(--ink)}
  .btn:disabled{opacity:.4}

  /* ---- Natija ---- */
  .result-big{font-size:64px;font-weight:800;text-align:center;line-height:1;margin:10px 0}
  .result-stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="muted" style="text-align:center;padding:40px">Yuklanmoqda…</div></div>

<script>
/* ============================================================
   PRAVA Mini App — starter
   Metod: yuqori-qiymatli (3점·5점) savollarga e'tibor → 60/70 ball
   Toifalar: 2종 (o'tish=60) va 1종 (o'tish=70)
   ============================================================ */

const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); }

/* ---- Saqlash: Telegramda CloudStorage, brauzerda xotira (localStorage emas) ---- */
/* Deploy qilib brauzerda ham saqlash kerak bo'lsa, mem o'rniga localStorage ishlatsang bo'ladi. */
const Store = (() => {
  const mem = {};
  const cloud = tg && tg.CloudStorage && tg.CloudStorage.getItem ? tg.CloudStorage : null;
  return {
    get:(k)=>new Promise(r=>{ cloud ? cloud.getItem(k,(e,v)=>r(e?null:(v||null))) : r(k in mem?mem[k]:null); }),
    set:(k,v)=>new Promise(r=>{ cloud ? cloud.setItem(k,v,()=>r(1)) : (mem[k]=v,r(1)); })
  };
})();

const haptic = (type)=>{ try{ tg?.HapticFeedback?.notificationOccurred(type); }catch(e){} };

/* ---- Holat ---- */
const STATE = {
  cat: "2",               // "1" yoki "2"
  questions: [],          // barcha savollar
  mastered: new Set(),    // kamida bir marta to'g'ri yechilgan id lar
  wrong: new Set(),       // xato daftari id lari
  session: null           // joriy o'qish/imtihon sessiyasi
};

/* Imtihon tarkibi (rasmiy struktura): 22×2점 + 17×3점 + 1×5점 = 100 */
const BLUEPRINT = { p2:22, p3:17, p5:1 };
const PASS = { "1":70, "2":60 };

const POOLS = {
  p5:["video"],
  p3:["photo","illust","text_multi"],
  p2:["sign","text_single"]
};
const poolOf = (q)=> q.points===5?"p5":(q.points===3?"p3":"p2");

/* ============================================================
   Yuklash
   ============================================================ */
async function boot(){
  try{
    const res = await fetch("questions.json?v="+Date.now());
    const data = await res.json();
    STATE.questions = data.questions || [];
  }catch(e){
    document.getElementById("app").innerHTML =
      "<div style='padding:40px;text-align:center'>questions.json yuklanmadi.<br><span class='muted'>"+e+"</span></div>";
    return;
  }
  const m = await Store.get("mastered"); if(m) STATE.mastered = new Set(JSON.parse(m));
  const w = await Store.get("wrong");    if(w) STATE.wrong   = new Set(JSON.parse(w));
  const c = await Store.get("cat");      if(c) STATE.cat = c;
  renderHome();
}

/* ---- Ball hisoblagich: taxminiy ta'minlangan ball ---- */
function securedBreakdown(){
  // Har hovuz uchun: o'rganilgan ulush × shu hovuzning imtihondagi ball ulushi
  const out = { p2:0, p3:0, p5:0 };
  for(const key of ["p2","p3","p5"]){
    const cats = POOLS[key];
    const pool = STATE.questions.filter(q=>cats.includes(q.category));
    if(!pool.length) continue;
    const done = pool.filter(q=>STATE.mastered.has(q.id)).length;
    const slotPoints = key==="p5"?BLUEPRINT.p5*5 : key==="p3"?BLUEPRINT.p3*3 : BLUEPRINT.p2*2;
    out[key] = Math.round((done/pool.length) * slotPoints);
  }
  return out; // {p2,p3,p5} — jami 100 dan
}

/* ============================================================
   BOSH EKRAN
   ============================================================ */
function renderHome(){
  const b = securedBreakdown();
  const total = b.p2+b.p3+b.p5;
  const pass = PASS[STATE.cat];
  const passed = total >= pass;
  const passPct = pass; // 0..100 shkalada

  const counts = {};
  for(const key of ["p5","p3","p2"]){
    const cats = POOLS[key];
    const pool = STATE.questions.filter(q=>cats.includes(q.category));
    counts[key] = { done: pool.filter(q=>STATE.mastered.has(q.id)).length, total: pool.length };
  }

  app(`
    <div class="top"><h2>Prava — nazariy imtihon</h2></div>

    <div class="seg">
      <button class="${STATE.cat==='2'?'on':''}" onclick="setCat('2')">2종 oddiy<span class="sub">o'tish: 60 ball</span></button>
      <button class="${STATE.cat==='1'?'on':''}" onclick="setCat('1')">1종 (dostavka/yuk)<span class="sub">o'tish: 70 ball</span></button>
    </div>

    <div class="meter-card">
      <div class="meter-head">
        <div><div class="meter-score num">${total}<small>/100</small></div>
        <div class="muted" style="font-size:13px">Taxminiy ta'minlangan ball</div></div>
        <div class="meter-goal">Maqsad<br><b>${pass}</b> ball</div>
      </div>
      <div class="bar">
        <span class="s5" style="width:${b.p5}%"></span>
        <span class="s3" style="width:${b.p3}%"></span>
        <span class="s2" style="width:${b.p2}%"></span>
        <div class="passline" data-l="${pass}" style="left:${passPct}%"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--yellow)"></i>Video 5점 (${counts.p5.done}/${counts.p5.total})</span>
        <span><i style="background:var(--blue)"></i>3점 (${counts.p3.done}/${counts.p3.total})</span>
        <span><i style="background:var(--green)"></i>2점 (${counts.p2.done}/${counts.p2.total})</span>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">
        ${passed ? '✓ Hozirgi tayyorgarlik o\'tish uchun yetarli' : `Yana ~${pass-total} ball kerak`}
      </div>
    </div>

    <div class="menu">
      ${tile("🎯","Aqlli o'qish","Avval eng ko'p ball keltiradigan savollar","smartStudy()","var(--yellow)","#11161F")}
      ${tile("📝","Imtihon simulyatori","40 savol · "+pass+" ball o'tish chizig'i","startExam()","var(--blue)","#fff")}
      ${tile("📕","Xato daftari","Xato qilgan savollaringni qayta ishла","reviewWrong()","var(--red)","#fff",STATE.wrong.size)}
    </div>

    <p class="muted" style="font-size:12px;margin-top:20px;text-align:center">
      ${STATE.cat==='1'
        ? "1종 uchun belgilar (2점) ham o'rganilsin — 70 ballga yetish uchun."
        : "2종 uchun 3점+5점 hovuzlari o'tishning asosiy yo'li."}
    </p>
  `);
}

function tile(ic,t,d,onclick,bg,fg,cnt){
  return `<button class="tile" onclick="${onclick}">
    <span class="ic" style="background:${bg};color:${fg}">${ic}</span>
    <span><span class="t">${t}</span><br><span class="d">${d}</span></span>
    ${cnt!==undefined?`<span class="cnt">${cnt}</span>`:''}
  </button>`;
}

async function setCat(c){ STATE.cat=c; await Store.set("cat",c); renderHome(); }

/* ============================================================
   SESSIYA QURISH
   ============================================================ */
function smartStudy(){
  // Metod tartibi: 5점 → 3점 (foto/illust/matn) → 1종 bo'lsa 2점 belgilar
  const order = STATE.cat==="1"
    ? ["video","photo","illust","text_multi","sign","text_single"]
    : ["video","photo","illust","text_multi"];
  let list = [];
  for(const cat of order){
    list = list.concat(STATE.questions.filter(q=>q.category===cat));
  }
  // o'rganilmaganlarni oldinga
  list.sort((a,b)=> (STATE.mastered.has(a.id)?1:0) - (STATE.mastered.has(b.id)?1:0));
  if(!list.length){ tg?.showAlert?.("Savol yo'q"); return; }
  STATE.session = { mode:"study", list, i:0 };
  renderQuestion();
}

function startExam(){
  // Rasmiy vazn: 22×2점 + 17×3점 + 1×5점 (yetarli bo'lmasa bor savollardan)
  const pick = (cats, n)=>{
    const pool = STATE.questions.filter(q=>cats.includes(q.category));
    return shuffle(pool).slice(0, Math.min(n, pool.length));
  };
  let list = [
    ...pick(POOLS.p5, BLUEPRINT.p5),
    ...pick(POOLS.p3, BLUEPRINT.p3),
    ...pick(POOLS.p2, BLUEPRINT.p2)
  ];
  list = shuffle(list);
  const demo = list.length < 40;
  STATE.session = { mode:"exam", list, i:0, demo, answers:{} };
  renderQuestion();
}

function reviewWrong(){
  const list = STATE.questions.filter(q=>STATE.wrong.has(q.id));
  if(!list.length){ tg?.showAlert?.("Xato daftaring bo'sh 👍"); return; }
  STATE.session = { mode:"study", list, i:0, fromWrong:true };
  renderQuestion();
}

/* ============================================================
   SAVOL EKRANI
   ============================================================ */
function renderQuestion(){
  const s = STATE.session, q = s.list[s.i];
  s.picked = [];
  s.checked = false;
  const total = s.list.length;
  const pp = q.points;
  const media = q.svg
    ? `<div class="media">${q.svg}</div>`
    : (q.media || q.media_note)
      ? `<div class="media">${q.media?`<img src="${q.media}" onerror="this.style.display='none'">`:''}
         ${q.media_note?`<div class="note">${q.media_note}</div>`:''}</div>`
      : "";

  app(`
    <div class="top"><button class="back" onclick="exitSession()">‹</button>
      <h2>${s.mode==='exam'?(s.demo?'Imtihon (demo)':'Imtihon'):(s.fromWrong?'Xato daftari':'Aqlli o\'qish')}</h2></div>
    <div class="qmeta">
      <span class="num">${s.i+1} / ${total}</span>
      <span class="pill p${pp}">${pp} ball</span>
    </div>
    <div class="progress"><i style="width:${(s.i)/total*100}%"></i></div>
    ${media}
    <div class="qtext">${q.question_uz}</div>
    ${q.select_count===2?`<div class="hint">Ikkita javob tanlang — ikkalasi to'g'ri bo'lsagina ball</div>`:''}
    <div class="opts" id="opts">
      ${q.options.map((o,idx)=>`
        <button class="opt" data-i="${idx}" onclick="pick(${idx})">
          <span class="box"></span><span>${o.text_uz}</span>
        </button>`).join("")}
    </div>
    <div id="explainSlot"></div>
    <div class="cta">
      <button class="btn primary" id="actBtn" onclick="checkOrNext()" disabled>Tekshirish</button>
    </div>
  `);
}

function pick(idx){
  const s = STATE.session, q = s.list[s.i];
  if(s.checked) return;
  const max = q.select_count;
  const pos = s.picked.indexOf(idx);
  if(pos>-1) s.picked.splice(pos,1);
  else { if(s.picked.length>=max) s.picked.shift(); s.picked.push(idx); }
  // UI
  document.querySelectorAll(".opt").forEach(el=>{
    el.classList.toggle("sel", s.picked.includes(+el.dataset.i));
    const box = el.querySelector(".box");
    box.textContent = s.picked.includes(+el.dataset.i) ? (max===2?"✓":"●") : "";
  });
  document.getElementById("actBtn").disabled = s.picked.length !== max;
}

function checkOrNext(){
  const s = STATE.session;
  if(!s.checked){ checkAnswer(); }
  else { nextQuestion(); }
}

function checkAnswer(){
  const s = STATE.session, q = s.list[s.i];
  s.checked = true;
  const correctIdx = q.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);
  const ok = correctIdx.length===s.picked.length && correctIdx.every(i=>s.picked.includes(i));

  document.querySelectorAll(".opt").forEach(el=>{
    const i = +el.dataset.i;
    el.classList.remove("sel");
    if(q.options[i].correct){ el.classList.add("correct"); el.querySelector(".box").textContent="✓"; }
    else if(s.picked.includes(i)){ el.classList.add("wrong"); el.querySelector(".box").textContent="✕"; }
  });

  // tushuntirish
  document.getElementById("explainSlot").innerHTML =
    `<div class="explain"><b>${ok?'To\'g\'ri ✓':'Xato ✕'}</b> — ${q.explanation_uz||''}</div>`;

  // holat saqlash
  if(ok){ STATE.mastered.add(q.id); STATE.wrong.delete(q.id); haptic('success'); }
  else  { STATE.wrong.add(q.id); haptic('error'); }
  Store.set("mastered", JSON.stringify([...STATE.mastered]));
  Store.set("wrong", JSON.stringify([...STATE.wrong]));
  if(s.mode==="exam") s.answers[q.id]=ok;

  const last = s.i >= s.list.length-1;
  const btn = document.getElementById("actBtn");
  btn.textContent = last ? (s.mode==="exam"?"Natijani ko'rish":"Yakunlash") : "Keyingi";
}

function nextQuestion(){
  const s = STATE.session;
  if(s.i >= s.list.length-1){
    s.mode==="exam" ? renderExamResult() : exitSession();
  } else { s.i++; renderQuestion(); }
}

function exitSession(){ STATE.session=null; renderHome(); }

/* ============================================================
   IMTIHON NATIJASI
   ============================================================ */
function renderExamResult(){
  const s = STATE.session;
  let score=0, right=0;
  for(const q of s.list){ if(s.answers[q.id]){ score+=q.points; right++; } }
  const pass = PASS[STATE.cat];
  // demo bo'lsa ballni 100 shkalaga taxminan keltirib ko'rsatamiz
  const passed = score>=pass;
  haptic(passed?'success':'error');

  app(`
    <div class="top"><h2>Imtihon natijasi</h2></div>
    <div class="meter-card" style="text-align:center">
      <div class="result-big" style="color:${passed?'var(--green)':'var(--yellow)'}">${score}<small style="font-size:24px;color:var(--muted)">/100</small></div>
      <div class="verdict ${passed?'pass':'fail'}" style="font-size:20px;text-align:center">
        ${passed?'합격 — O\'tdingiz! ✓':'O\'tmadingiz — yana mashq qiling'}</div>
      ${s.demo?`<p class="muted" style="font-size:12px">Demo: bankда ${s.list.length} savol bor. To'liq bankda 40 savollik haqiqiy imtihon bo'ladi.</p>`:''}
    </div>
    <div style="background:var(--surface);border-radius:16px;padding:4px 16px;margin-bottom:18px">
      <div class="result-stat"><span>To'g'ri javoblar</span><b class="num">${right} / ${s.list.length}</b></div>
      <div class="result-stat"><span>O'tish chizig'i (${STATE.cat}종)</span><b class="num">${pass} ball</b></div>
      <div class="result-stat" style="border:none"><span>Sizning balingiz</span><b class="num">${score} ball</b></div>
    </div>
    <div class="cta">
      ${STATE.wrong.size?`<button class="btn ghost" style="margin-bottom:10px" onclick="reviewWrong()">Xatolarni ishlash (${STATE.wrong.size})</button>`:''}
      <button class="btn primary" onclick="exitSession()">Bosh sahifa</button>
    </div>
  `);
}

/* ---- yordamchi ---- */
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function app(html){ document.getElementById("app").innerHTML = html; window.scrollTo(0,0); }

boot();
</script>
</body>
</html>
